[project]
name = "policybench"
version = "0.0.1"
description = "Measurement and deployment stack for a visuomotor policy: sampler, latency, control loop, serving"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "av>=15",
    "gym-pusht==0.1.8",
    "huggingface-hub>=0.34",
    "hydra-core==1.3.7",
    "matplotlib>=3.10",
    "pandas>=2.2",
    "pyarrow>=21",
    # Reads the pretrained checkpoint's own normalization buffers (models/pretrained.py).
    "safetensors>=0.4",
    "torch==2.14.1",
    "torchvision==0.29.1",
    "triton-windows==3.8.0.post29 ; sys_platform == 'win32'",
    "zarr>=3,<4",
]

[dependency-groups]
dev = [
    "mypy>=2.3",
    "pre-commit>=4",
    "pytest>=8",
    "ruff>=0.16",
]

# docs/02 section 5.2: torch and torchvision come from the cu130 index only,
# everything else from PyPI. The path with /cu130 is the verified layout.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policybench"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Prose, data, vendored code and the agent kit's own hook are not lint targets.
extend-exclude = ["docs", "third_party", "results", "data", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["gym_pusht.*"]
ignore_missing_imports = true

# Optional backend for the pretrained checkpoint (docs/02 section 3.1). It is
# deliberately not a project dependency: lerobot 0.6.1 caps torch at <2.12 and this
# project pins torch 2.14.1, so it is installed `--no-deps` on top of the sync.
[[tool.mypy.overrides]]
module = ["lerobot.*", "diffusers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "unit: fast CPU-only tests; the only marker that runs in CI",
    "smoke: end-to-end tiny training run on CPU; the CI smoke job (docs/01 section 4)",
    "integration: multi-component tests, local by default",
    "slow: runs longer than ~60 s",
    "gpu: needs a CUDA device; never runs in CI",
]
