[project]
name = "flowpolicy"
version = "0.0.1"
description = "Conditional flow-matching visuomotor policy: training, eval, inference, deployment"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.14.1",
    "torchvision==0.29.1",
]

[dependency-groups]
dev = [
    "mypy>=2.3",
    "pre-commit>=4",
    "pytest>=8",
    "ruff>=0.16",
]

# docs/02 section 5.2: torch and torchvision come from the cu130 index only,
# everything else from PyPI. The path with /cu130 is the verified layout.
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowpolicy"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Prose, data, vendored code and the agent kit's own hook are not lint targets.
extend-exclude = ["docs", "third_party", "results", "data", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "unit: fast CPU-only tests; the only marker that runs in CI",
    "integration: multi-component tests, local by default",
    "slow: runs longer than ~60 s",
    "gpu: needs a CUDA device; never runs in CI",
]
