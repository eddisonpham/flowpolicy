name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run mypy

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -m "unit and not gpu"

  # The adapter path is invisible to the jobs above: `lerobot` caps `torch<2.12` against this
  # project's 2.14.1 pin, so it is not in the lockfile and every test that loads it skips there.
  # This job installs it the way `just setup-pretrained` does -- `--no-deps`, on top of the pinned
  # stack -- so those tests report `passed` instead of `skipped`. No weights: the checkpoint's
  # contract tests read its config.json and processor JSONs, which are kilobytes.
  # `transformers` is deliberately absent: one test asserts the config loads *without* it, and a
  # VLA weight load needs a GPU this runner does not have (agents/05_ci_and_repro.md).
  pretrained-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: bash scripts/setup_pretrained.sh
      - run: uv run pytest -m "unit and not gpu" -q

  # docs/01 section 4 promises a tiny end-to-end training run, not just component tests:
  # 20 steps on synthetic data must lower the loss and survive a resume at rtol=1e-5.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -m "smoke" -q

  # Guards the invariant that every published number comes from results/*.jsonl: the
  # checked-in tables must be exactly what the generators produce from the checked-in rows.
  tables-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run python scripts/make_tables.py
      - run: uv run python scripts/make_readme.py
      - run: git diff --exit-code -- results/tables README.md

# GPU, simulator and ROS 2 tests are local only. docs/01 section 4.
